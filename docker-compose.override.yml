# LOCAL DEV ONLY — do not commit.
#
# Two things production deliberately does NOT want, which local dev needs:
#
#  1. The backend image built from the local working tree, so changes can be
#     exercised before they are released to Docker Hub.
#  2. Port 8080 published on the host. Production keeps the backend unpublished
#     and reachable only through nginx; Vite's dev proxy targets
#     http://localhost:8080, so dev needs it on the host.
services:
  backend:
    image: lealre/aftercredits-backend:slog-local
    pull_policy: never
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-info}"
