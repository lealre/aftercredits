# Full application stack (postgres + backend + frontend).
#
# Used both locally and on the Raspberry Pi — the Pi runs entirely from its
# SSD, so the database lives in a named docker volume rather than a
# machine-specific bind mount, and no separate Pi compose file is needed.
#
#   docker compose up -d
#
# db-setup applies the schema migrations and creates the superuser before the
# backend starts; it exits when done.
#
# Secrets come from .env (required: true — a missing or empty .env now fails the
# deploy loudly instead of silently defaulting through to published credentials).
# Each service gets ONLY the variables it needs, so a foothold in one container
# does not hand over every secret.

services:
  postgres:
    image: postgres:16
    container_name: aftercredits-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
    # Bound to loopback: the app reaches postgres over the compose network,
    # so the published port is only for local psql/inspection.
    ports:
      - "127.0.0.1:${POSTGRES_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER}\" -d \"${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db-setup:
    image: lealre/aftercredits-backend:latest
    pull_policy: always
    container_name: aftercredits-db-setup
    # Needs the DB connection and the superuser credentials; nothing else.
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - SUPERUSER_USERNAME=${SUPERUSER_USERNAME:?SUPERUSER_USERNAME is required}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD:?SUPERUSER_PASSWORD is required}
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL:-}
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "set -e && echo 'Applying schema migrations...' && /app/database -migrate && echo 'Running superuser setup...' && /app/database -superuser"]
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: lealre/aftercredits-backend:latest
    pull_policy: always
    container_name: aftercredits-backend
    restart: unless-stopped
    # The API's secrets: DB connection, JWT signing key, and the title-provider
    # config. NOT the superuser credentials — only db-setup provisions those.
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - TITLE_PROVIDER=${TITLE_PROVIDER:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - OMDB_API_KEY=${OMDB_API_KEY:-}
      - ACTIVITY_FEED_ENABLED=${ACTIVITY_FEED_ENABLED:-true}
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    # NOT published to the host. nginx reaches the backend as backend:8080 over
    # the compose network; publishing it created a second door that bypassed
    # every nginx-tier control and was one tunnel-ingress typo from the open
    # internet. For a local debug handle, add "127.0.0.1:8080:8080" — never a
    # bare "8080:8080", which binds all interfaces.
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    # No env_file / environment: nginx reads no environment variable and the
    # built bundle inlines none, so handing this internet-facing container the
    # .env only widened the blast radius of a compromise.
    container_name: aftercredits-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Loopback only, and now purely for debugging from the Pi itself —
      # cloudflared is a container on the `tunnel` network below and reaches
      # this service by name, not through a published port. Keeping it off the
      # LAN is what makes the nginx real-IP and rate-limit config trustworthy.
      - "127.0.0.1:8081:80"
    # The single hop between the public internet and everything else: on both
    # networks, so cloudflared can reach it without cloudflared being able to
    # reach anything behind it.
    networks:
      - default
      - tunnel
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    # The Cloudflare Tunnel connector. Makes an OUTBOUND connection to
    # Cloudflare, so nothing is forwarded at the router and the home IP is
    # never published.
    #
    # Pinned by digest rather than a tag. This process terminates traffic from
    # the public internet; an unattended image change is not something to find
    # out about afterwards.
    image: cloudflare/cloudflared:2026.8.1@sha256:d9ff527dc19799e24d3689058161fb01e752a24be1823577bae54c9c2489275f
    container_name: aftercredits-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    # THE control that makes exposing this safe, and the reason it is not run
    # on the host. On its own network with only the frontend, this container
    # cannot resolve or route to postgres, the backend, SSH, the dashboard on
    # :8050, or anything else on the LAN. An ingress rule pointed somewhere it
    # should not be fails to connect rather than succeeding at something
    # unintended — the isolation is structural, not a config to get right.
    networks:
      - tunnel
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    driver: bridge
  tunnel:
    driver: bridge
    ipam:
      config:
        # Pinned, because nginx's set_real_ip_from trusts exactly this range.
        # Letting Docker choose would silently change which peer is trusted to
        # set CF-Connecting-IP, and rate limiting would key on the wrong thing.
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    name: aftercredits-postgres-data
