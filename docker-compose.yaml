# Full application stack (postgres + backend + frontend).
#
# Used both locally and on the Raspberry Pi — the Pi runs entirely from its
# SSD, so the database lives in a named docker volume rather than a
# machine-specific bind mount, and no separate Pi compose file is needed.
#
#   docker compose up -d
#
# The backend applies the schema migrations itself at boot, so there is no
# separate migration step to sequence. Creating the first admin user is a
# one-off:
#
#   docker compose run --rm backend /app/database -superuser

services:
  postgres:
    image: postgres:16
    container_name: aftercredits-postgres
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aftercredits}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aftercredits}
      - POSTGRES_DB=${POSTGRES_DB:-aftercredits}
    # Bound to loopback: the app reaches postgres over the compose network,
    # so the published port is only for local psql/inspection.
    ports:
      - "127.0.0.1:${POSTGRES_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-aftercredits}\" -d \"${POSTGRES_DB:-aftercredits}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: lealre/aftercredits-backend:latest
    container_name: aftercredits-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    container_name: aftercredits-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  postgres_data:
    name: aftercredits-postgres-data
