# Rate-limit and connection-limit zones. This file is included at http scope
# (conf.d/*.conf), so these http-context directives belong here, ABOVE the
# server block — putting them inside `server {}` is a fatal config error.
#
# The key is $binary_remote_addr, which — after the real_ip config in the
# server block resolves CF-Connecting-IP — is the actual client IP, not
# cloudflared's. See the real_ip note below for why that resolution, and the
# operator prerequisites, matter.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=streams:10m;

# Do not advertise the nginx version.
server_tokens off;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Real client IP behind the Cloudflare Tunnel.
    #
    # Every request arrives from cloudflared, so $remote_addr is cloudflared's
    # address, not the visitor's — which would make per-IP rate limiting either
    # a no-op (one bucket for the whole internet) or a self-inflicted lockout
    # (the whole family sharing cloudflared's IP). cloudflared forwards the real
    # client in CF-Connecting-IP; real_ip rewrites $remote_addr to it.
    #
    # set_real_ip_from lists who is TRUSTED to set that header. It is the Docker
    # private ranges here, which cover cloudflared whether it runs as a sibling
    # container on the compose network or as a host process reaching a published
    # port (the request then enters the container from the docker gateway).
    #
    # OPERATOR PREREQUISITE: port 8081 must NOT be reachable from the LAN. If it
    # is, anything on these ranges can hit nginx directly and forge
    # CF-Connecting-IP to mint a fresh rate-limit bucket per request. Narrow
    # set_real_ip_from to cloudflared's exact peer address once known. See the
    # tunnel checklist in the deploy notes.
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;

    # A rate-limited request gets 429 (default is 503, which reads as an outage).
    limit_req_status 429;
    limit_conn_status 429;

    # Cap request bodies at the edge as well as in the backend.
    client_max_body_size 64k;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # The activity SSE stream.
    #
    # Same upstream as /api/, but three of that block's defaults break a long-
    # lived stream, and all three fail SILENTLY — the connection is established,
    # the client sees `open`, and no event ever arrives:
    #
    #   proxy_buffering      on (default) — nginx holds the response until a
    #                        buffer fills, which for a low-traffic feed is
    #                        effectively never. The backend also sends
    #                        X-Accel-Buffering: no, so this is belt and braces.
    #   proxy_read_timeout   60s (default) — nginx cuts a connection idle that
    #                        long. The backend pings every 25s, so 120s is
    #                        comfortably above it while still capping a stalled
    #                        upstream.
    #   gzip                 the compression filter buffers, so adding text/*
    #                        or text/event-stream to gzip_types above would
    #                        silently re-break the stream. Off here explicitly.
    #
    # An exact-match (=) location, so it wins over the /api/ prefix below and is
    # NOT in the `api` rate-limit zone (a held-open stream is not a flood). A
    # per-IP connection cap instead: sized well above one-tab-per-member because
    # the whole family shares one public IP behind the tunnel.
    location = /api/activity/stream {
        limit_conn streams 10;

        proxy_pass http://backend:8080/activity/stream;
        proxy_http_version 1.1;
        # Not 'upgrade': SSE is a plain HTTP response held open, not a protocol
        # switch. Empty lets nginx keep its own connection handling.
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        gzip off;

        include /etc/nginx/snippets/security-headers.conf;
    }

    # Login: a tight per-IP limit against credential stuffing. An exact-match
    # location inherits NOTHING from the /api/ block — not proxy_pass, not the
    # proxy headers — so they are all respelled here. proxy_pass carries the
    # /login path explicitly (a bare .../ would rewrite it to / and 404).
    location = /api/login {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://backend:8080/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # User list / admin-only registration: same tight limit as login.
    location = /api/users {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://backend:8080/users;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Proxy the rest of the API to the backend.
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Authenticated JSON must never be cached by a shared proxy/edge.
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Cache control for index.html (no cache for main entry point)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Error pages
    error_page 404 /index.html;
}
