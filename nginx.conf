server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # The activity SSE stream.
    #
    # Same upstream as /api/, but three of that block's defaults break a long-
    # lived stream, and all three fail SILENTLY — the connection is established,
    # the client sees `open`, and no event ever arrives:
    #
    #   proxy_buffering      on (default) — nginx holds the response until a
    #                        buffer fills, which for a low-traffic feed is
    #                        effectively never. The backend also sends
    #                        X-Accel-Buffering: no, so this is belt and braces.
    #   proxy_read_timeout   60s (default) — nginx cuts a connection idle that
    #                        long. The backend pings every 25s so it should not
    #                        trigger, but a stalled upstream must not take the
    #                        client's connection down with it in a minute.
    #   gzip                 the compression filter buffers, so adding text/*
    #                        or text/event-stream to gzip_types above would
    #                        silently re-break the stream. Off here explicitly.
    #
    # An exact-match (=) location, so it wins over the /api/ prefix below and
    # nothing else changes.
    location = /api/activity/stream {
        proxy_pass http://backend:8080/activity/stream;
        proxy_http_version 1.1;
        # Not 'upgrade': SSE is a plain HTTP response held open, not a protocol
        # switch. Empty lets nginx keep its own connection handling.
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache control for index.html (no cache for main entry point)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Error pages
    error_page 404 /index.html;
}

