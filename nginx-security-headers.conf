# Security response headers, included into every location that returns content.
#
# nginx does NOT inherit add_header from an outer scope into a location that
# sets ANY add_header of its own, so these are included per-location rather than
# declared once at server level — otherwise the locations that set their own
# Cache-Control would silently drop all of these.
#
# CSP notes for THIS app:
#   style-src 'unsafe-inline' — shadcn/Radix set inline style attributes.
#   img-src data: https:      — posters come from external providers over https.
#   connect-src 'self'        — API and the SSE stream are same-origin (/api).
#   script-src 'self'         — index.html carries no inline script.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
